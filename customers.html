<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- link bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <link rel="stylesheet" href="assets/style.css" />
  <title>Customers</title>
</head>

<body>
  <div class="d-flex bg-light" id="wrapper">
    <!-- Sidebar -->
    <div class="bg-white shadow-sm" id="sidebar-wrapper">
      <div id="sidebar" class="sidebar-heading py-4 primary-text fs-3 fw-bold text-uppercase border-bottom">
        <img style="width: 60px; height: 60px; object-fit: cover;" src="assets/images/Logo.png" alt="">Seellest
      </div>
      <div class="list-group list-group-flush my-3 fs-5">
        <a href="dashboard.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold"><i
            class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
        <a href="products.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold"><i
            class="fas fa-tags me-2"></i></i>
          Products</a>
        <a href="customers.html" class="list-group-item list-group-item-action bg-transparent second-text active"><i
            class="fas fa-users me-2"></i></i>Customers</a>
      </div>
    </div>
    <!-- /#sidebar-wrapper -->

    <!-- Page Content -->
    <div id="page-content-wrapper" class="container-fluid mx-4">
      <nav class="navbar navbar-expand-lg navbar-light bg-transparent mt-4 mb-3">
        <div class="d-flex align-items-center">
          <i class="fas fa-align-left primary-text fs-4 me-3" id="menu-toggle"></i>
          <h2 class="fs-2 m-0">Customers</h2>
        </div>
      </nav>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <!-- Search -->
        <form class="form-inline" style="width: 35%;">
          <input class="form-control shadow-sm" id="searchInput" type="search" placeholder="Search">
        </form>

        <!-- Add new customer modal -->
        <button class="btn primary-bg text-white px-4 newCustomer border-0" data-bs-toggle="modal"
          data-bs-target="#addNewModal">
          <i class="fas fa-plus me-2"></i> Add New
        </button>

      </div>

      <!-- table customers -->
      <table class="bg-white table table-hover table shadow-sm border" id="crudTable">
        <thead class="customer-table">
          <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Status</th>
            <th>Total Orders</th>
            <th>Last Contact Date</th>
            <th>Notes</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="ordersTable"></tbody>

      </table>

      <!-- Add customer Modal form -->
      <div class="modal fade" id="addNewModal">
        <div class="modal-dialog modal-dialog-centered modal-lg">
          <div class="modal-content p-3">

            <div class="modal-header">
              <h5 class="modal-title">Add New Customer</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

              <form id="myForm">
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Full Name</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Enter full name" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Phone</label>
                    <input type="text" class="form-control" id="phone" placeholder="Enter phone number" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Address</label>
                  <input type="text" class="form-control" id="address" placeholder="Enter address" required>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Status</label>
                  <select class="form-control" id="status" required>
                    <option>Active</option>
                    <option>Inactive</option>
                    <option>Lead</option>
                  </select>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Total Orders</label>
                    <input type="number" class="form-control" id="totalOrders" placeholder="0" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Last Contact Date</label>
                    <input type="date" class="form-control" id="lastContactDate" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Notes</label>
                  <textarea class="form-control" rows="3" id="notes" placeholder="Enter notes..."></textarea>
                </div>

              </form>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" form="myForm" class="btn btn-success submit"
                style="background:#009d63; border:none;">Save</button>
            </div>

          </div>
        </div>
      </div>

      <!-- Read data modal -->
      <div class="modal fade" id="readData">
        <div class="modal-dialog modal-dialog-centered modal-lg">
          <div class="modal-content p-3">

            <div class="modal-header">
              <h5 class="modal-title">Customer</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

              <form id="myForm">
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Full Name</label>
                    <input type="text" class="form-control" id="showFullname" placeholder="Enter full name" disabled>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Phone</label>
                    <input type="text" class="form-control" id="showPhone" placeholder="Enter phone number" disabled>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Address</label>
                  <input type="text" class="form-control" id="showAddress" placeholder="Enter address" disabled>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Status</label>
                  <select class="form-control" id="showStatus">
                    <option>Active</option>
                    <option>Inactive</option>
                    <option>Lead</option>
                  </select>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Total Orders</label>
                    <input type="number" class="form-control" id="showTotalOrders" placeholder="0" disabled>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Last Contact Date</label>
                    <input type="date" class="form-control" id="showLastContactDate" disabled>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Notes</label>
                  <textarea class="form-control" rows="3" id="showNotes" placeholder="Enter notes..."></textarea>
                </div>

              </form>
            </div>

          </div>
        </div>
      </div>

      <!-- DELETE MODAL -->
      <div class="modal fade" id="deleteModal">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content p-3">

            <div class="modal-header">
              <h5 class="modal-title text-danger fw-bold">Delete Customer</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body text-center">
              <i class="fas fa-exclamation-triangle text-danger fs-1 mb-3"></i>
              <p class="fs-5">Are you sure you want to delete this customer?</p>
            </div>

            <div class="modal-footer d-flex justify-content-center">
              <button class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancel</button>
              <button class="btn btn-danger px-4" id="confirmDeleteBtn" data-bs-dismiss="modal">Delete</button>
            </div>

          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
      <script src="assets/customers.js"></script>
      <script>
        let el = document.getElementById("wrapper");
        let toggleButton = document.getElementById("menu-toggle");

        toggleButton.onclick = function () {
          el.classList.toggle("toggled");
        };
      </script>
</body>

</html>
