<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- link bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- link css  -->
  <link rel="stylesheet" href="style.css">
  <!-- link font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">

    <!-- Login Card -->
    <div class="card shadow p-4 w-100" style="max-width: 450px;">

      <h3 class="text-center mb-4">Sign in</h3>

      <form action="dashboard.html" onsubmit="return authenticate()">
        <!-- use hardcode -->
        <!-- Username -->
        <div class="mb-3">
          <label for="inputUsername" class="form-label">Username</label>
          <input type="text" class="form-control" id="inputUsername" placeholder="Username" name="username" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>

          <div class="input-group">
            <input type="password" class="form-control border-end-0" id="password" placeholder="Password"
              name="password" required>

            <span class="input-group-text bg-transparent border-start-0" id="eyeIcon" style="cursor: pointer;">
              <i class="fa-solid fa-eye-slash"></i>
            </span>
          </div>

          <!-- Error message -->
          <small id="errorMessage" class="d-none" style="color: red;">
            Sorry, Password is incorrect.
          </small>
        </div>

        <!-- Button -->
        <div class="d-grid">
          <button type="submit" class="btn" style="background-color: #009d63; color: white;">Sign in</button>
        </div>

      </form>

    </div>
  </div>

  <script>
    let eyeIcon = document.getElementById("eyeIcon");
    let password = document.getElementById("password");
    let icon = eyeIcon.querySelector("i");

    eyeIcon.onclick = function () {
      if (password.type == "password") {
        password.type = "text";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      } else {
        password.type = "password";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      }
    }

    /*
    eyeIcon.onclick = function () {
      const isHidden = password.type === "password";

      password.type = isHidden ? "text" : "password";
      icon.classList.toggle("fa-eye");
      icon.classList.toggle("fa-eye-slash");
    };
    */

    // hard-coded
    function authenticate() {
      let authorized;

      // Get the values from the input fields
      let username = document.getElementById("inputUsername").value;
      let password = document.getElementById("password").value;
      let errorMessage = document.getElementById("errorMessage");

      // Check if the entered username and password match
      if (username === "admin" && password === "@#$1234") {
        errorMessage.classList.add("d-none"); // hide error
        authorized = true;
      } else {
        // show the message below the password if credentials are in correct
        errorMessage.classList.remove("d-none"); // show error
        authorized = false;
      }
      // return true if authorized or false if not
      return authorized;
    }

  </script>
</body>

  </html>
