<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- link bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- link css  -->
  <link rel="stylesheet" href="css/style.css">
  <!-- link font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">

    <!-- Login Card -->
    <div class="card shadow p-4 w-100" style="max-width: 450px;">

      <h3 class="text-center mb-4">Sign in</h3>

      <form action="dashboard.html" onsubmit="return authenticate()">
        <!-- use hardcode -->
        <!-- Username -->
        <div class="mb-3">
          <label for="inputUsername" class="form-label">Username</label>
          <input type="text" class="form-control" id="inputUsername" placeholder="Username" name="username" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>

          <div class="input-group">
            <input type="password" class="form-control border-end-0" id="password" placeholder="Password"
              name="password" required>

            <span class="input-group-text bg-transparent border-start-0" id="eyeIcon" style="cursor: pointer;">
              <i class="fa-solid fa-eye-slash"></i>
            </span>
          </div>

          <!-- Error message -->
          <small id="errorMessage" class="d-none" style="color: red;">
            Sorry, Password is incorrect.
          </small>
        </div>

        <!-- Button -->
        <div class="d-grid">
          <button type="submit" class="btn" style="background-color: #009d63; color: white;">Sign in</button>
        </div>

      </form>

    </div>
  </div>

  <script src="js/login.js"></script>
</body>

  </html>
