<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- link bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- link font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <!-- link css -->
  <link rel="stylesheet" href="css/style.css" />
  <title>Products</title>
</head>

<body>
  <div class="d-flex bg-light" id="wrapper">
    <!-- Sidebar -->
    <div class="bg-white shadow-sm" id="sidebar-wrapper">
      <div id="sidebar" class="sidebar-heading py-4 primary-text fs-3 fw-bold text-uppercase border-bottom">
        <img style="width: 60px; height: 60px; object-fit: cover;" src="image/Logo.png" alt="">Seellest
      </div>
      <div class="list-group list-group-flush my-3 fs-5">
        <a href="dashboard.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold"><i
            class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
        <a href="products.html" class="list-group-item list-group-item-action bg-transparent second-text active"><i
            class="fas fa-tags me-2"></i></i>
          Products</a>
        <a href="customers.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold"><i
            class="fas fa-users me-2"></i></i>Customers</a>
      </div>
    </div>
    <!-- /#sidebar-wrapper -->

    <!-- Page Content -->
    <div id="page-content-wrapper" class="container-fluid mx-4">
      <nav class="navbar navbar-expand-lg navbar-light bg-transparent mt-4 mb-3">
        <div class="d-flex align-items-center">
          <i class="fas fa-align-left primary-text fs-4 me-3" id="menu-toggle"></i>
          <h2 class="fs-2 m-0">Products</h2>
        </div>
      </nav>

      <!-- Search + Add button (grows to full width on mobile) -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <!-- Search input -->
        <form class="form-inline" style="width: 35%;">
          <input class="form-control shadow-sm" id="searchInput" type="search" placeholder="Search"
            aria-label="Search products">
        </form>

        <!-- Add Product button -->
        <button class="btn primary-bg text-white border-0 px-4 fw-semibold newProduct shadow-sm"
          style="white-space: nowrap;" data-bs-toggle="modal" data-bs-target="#addNewModal">
          <i class="fas fa-plus me-2"></i>Add Product
        </button>
      </div>

      <section class="py-3">
        <div class="row cards" id="productContainer">
          <!-- Product cards will be display here via JS -->
        </div>
      </section>

    </div>
  </div>

  <!-- Product Form Modal -->
  <div class="modal fade" id="productForm">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Add Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form id="productFormElement">

            <div class="mb-3 text-center">
              <img src="assets/images/Logo.png" alt="Product Image" id="productImgPreview"
                class="mb-2">
              <input type="file" id="productImgInput" class="form-control">
            </div>

            <div class="mb-3">
              <label for="productName" class="form-label">Name:</label>
              <input type="text" id="productName" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="productPrice" class="form-label">Price:</label>
              <input type="number" step="0.01" min="0" id="productPrice" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="productStock" class="form-label">Stock:</label>
              <input type="number" id="productStock" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="productDescription" class="form-label">Description:</label>
              <textarea type="text" rows="4" id="productDescription" class="form-control" required></textarea>
            </div>

          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" form="productFormElement" class="btn primary-bg btn-success onclick"
            id="submitProductBtn">Add
            Product</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Product Detail Modal -->
  <div class="modal fade" id="productDetailModal">
    <div class="modal-dialog modal-dialog-centered ">
      <div class="modal-content">

        <div class="modal-header ">
          <h5 class="modal-title" id="detailTitle">Product Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="text-center mb-3">
            <img id="detailImg" src="" class="mb-3" style="object-fit:cover; width: 200px;">
          </div>
          <h4 class="modal-title" id="detailName"></h4>
          <p class="fw-bold pt-2 primary-text" id="detailPrice"></p>
          <p id="detailStock"></p>
          <p class="text-muted" id="detailDescription"></p>
        </div>

        <div class="modal-footer border-0">
          <button class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Close</button>
        </div>

      </div>
    </div>
  </div>

  <!-- DELETE MODAL -->
  <div class="modal fade" id="deleteModal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-3">

        <div class="modal-header">
          <h5 class="modal-title text-danger fw-bold">Delete Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body text-center">
          <i class="fas fa-exclamation-triangle text-danger fs-1 mb-3"></i>
          <p class="fs-5">Are you sure you want to delete this product?</p>
        </div>

        <div class="modal-footer d-flex justify-content-center">
          <button class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger px-4" id="confirmDeleteBtn" data-bs-dismiss="modal">Delete</button>
        </div>

      </div>
    </div>
  </div>

  <script src="js/products.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let el = document.getElementById("wrapper");
    let toggleButton = document.getElementById("menu-toggle");

    toggleButton.onclick = function () {
      el.classList.toggle("toggled");
    };
  </script>
</body>

</html>
